- id: global_f220_flushing_rainy_toddler_events
  query: "what free things can I do with a toddler in Flushing this Saturday if it rains?"
  abstain: false
  capability: general-chat
  invariants: {must_ground: true, must_not_fabricate: true}
  tags: [F220, events, family, current-information, must-win]
  utility_criterion: >-
    Return at least one verified free indoor toddler-appropriate option in or near Flushing for
    the requested Saturday, or plainly say that no exact match was verified and give a useful
    official same-day lookup route. Do not return a generic request for more detail because the
