name: snap_centers
category: benefits
description: >-
  Find the nearest HRA SNAP (food stamps) application / enrollment center to apply
  in person, grounded in the city's official list of the ~13 SNAP centers citywide.
keywords:
  - snap center
  - snap office
  - food stamps office
  - apply for snap in person
  - hra snap center
  - ebt office
  - where to apply for snap
examples:
  - "Where's the nearest SNAP center?"
  - "Where do I apply for food stamps in person?"
datasets:
  - id: tc6u-8rnp
    category: snap_center
    field_map:
      name: facility_name
      lat: latitude
      lon: longitude
      address: street_address
      borough: borough
      hours: comments
    limitations: >-
      These are regular hours. Confirm holiday or temporary schedule exceptions before traveling.
allowlist:
  - access.nyc.gov
  - nyc.gov
seeds:
  - https://a069-access.nyc.gov/accesshra/
  - https://www.nyc.gov/assets/hra/ACCESSNYC/html/snapfaq/english.shtml
focus_tools:
  - nearest
  - official_sources
prompt: |
  For "where do I apply for SNAP / food stamps in person" or "SNAP center/office near me",
  call nearest(category="snap_center", near=<the user's address>, k=1). Report ONLY the center the
  tool returns and cite each one, these are the ~13 HRA SNAP application/enrollment centers.

  After nearest, call official_sources once with both declared SNAP pages to verify the online
  application and help options. Add the supported ACCESS HRA online option without making the
  resident visit a center. Include a phone handoff only when the retrieved page explicitly supports
  it. A phone handoff is for general SNAP help, never schedule confirmation, unless the retrieved
  page explicitly says it confirms center hours. Pass through every service-specific hours qualifier
  and the row update date. The center source does NOT surface a phone number, so label its schedule
  as regular hours and warn that holiday or temporary exceptions may exist. NEVER invent phone
  numbers or eligibility rules. If retrieval or geocoding fails, don't guess.
eval: eval.yaml
