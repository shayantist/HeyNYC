name: snap_centers
category: benefits
description: >-
  Find the nearest HRA SNAP (food stamps) application / enrollment center to apply
  in person, grounded in the city's official list of the ~13 SNAP centers citywide.
keywords:
  - snap center
  - snap office
  - food stamps office
  - apply for snap in person
  - hra snap center
  - ebt office
  - where to apply for snap
examples:
  - "Where's the nearest SNAP center?"
  - "Where do I apply for food stamps in person?"
datasets:
  - id: tc6u-8rnp
    category: snap_center
    field_map:
      name: facility_name
      lat: latitude
      lon: longitude
      address: street_address
      borough: borough
      hours: comments
    limitations: >-
      These are regular hours. Confirm holiday or temporary schedule exceptions before traveling.
allowlist:
  - access.nyc.gov
  - nyc.gov
seeds:
  - https://www.nyc.gov/site/hra/help/snap-benefits-food-program.page
  - https://www.nyc.gov/site/hra/help/snap-application-frequently-asked-questions.page
  - https://www.nyc.gov/site/hra/help/access-hra-resources.page
  - https://www.nyc.gov/site/hra/help/snap-interview-instructions.page
  - https://www.nyc.gov/site/hra/about/contact.page
focus_tools:
  - nearest
  - web_fetch
prompt: |
  For "where do I apply for SNAP / food stamps in person" or "SNAP center/office near me",
  call nearest(category="snap_center", near=<the resident's supplied location>, k=1). An address,
  landmark, neighborhood, or borough is enough to run a rough search. Disclose when a broad origin
  makes distance approximate and offer to refine afterward. Do not block urgent help on a more
  precise origin. Report ONLY the center the tool returns and cite each one, these are the ~13 HRA
  SNAP application/enrollment centers.

  After nearest, call web_fetch once with these exact current pages:
  https://www.nyc.gov/site/hra/help/snap-benefits-food-program.page,
  https://www.nyc.gov/site/hra/help/snap-application-frequently-asked-questions.page,
  https://www.nyc.gov/site/hra/help/access-hra-resources.page, and
  https://www.nyc.gov/site/hra/help/snap-interview-instructions.page, and
  https://www.nyc.gov/site/hra/about/contact.page. Use them to verify the online
  in-person and online application options and help options. The application FAQ establishes
  that SNAP walk-in centers help with completing an online application or a paper application.
  Add the supported ACCESS HRA online option without making the
  resident visit a center. Include a phone handoff only when the retrieved page explicitly supports
  it. A phone handoff is for general SNAP help, never schedule confirmation, unless the retrieved
  page explicitly says it confirms center hours. Report the row update date.
  The runtime appends the structured dataset limitation, so do not restate its holiday or temporary-hours warning. The center
  source does NOT surface a phone number. NEVER invent phone numbers or eligibility rules. If
  retrieval or geocoding fails, don't guess.

  For a failed upload or near deadline, lead with the resident's urgent submission problem before
  distance. Separate the official options for submitting an application or recertification from
  the ACCESS HRA option for submitting supporting documents. If the contact page was retrieved,
  give the DSS OneNumber and its SNAP menu option as the immediate route to ask HRA how to submit
  the documents after the failed upload. State which action each retrieved page supports. A SNAP
  center is an in-person interview and help option, not a confirmed document-upload channel. Never
  say the interview right fixes an upload. Say when the source does not establish how a failed
  upload affects the deadline. Never promise a deadline extension or claim that visiting a center
  preserves the deadline unless retrieved evidence says so.
eval: eval.yaml
