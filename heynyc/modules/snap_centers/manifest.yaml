name: snap_centers
category: benefits
description: >-
  Find the nearest HRA SNAP (food stamps) application / enrollment center to apply
  in person — grounded in the city's official list of the ~13 SNAP centers citywide.
keywords:
  - snap center
  - snap office
  - food stamps office
  - apply for snap in person
  - hra snap center
  - ebt office
  - where to apply for snap
examples:
  - "Where's the nearest SNAP center?"
  - "Where do I apply for food stamps in person?"
datasets:
  - id: tc6u-8rnp
    category: snap_center
    field_map:
      name: facility_name
      lat: latitude
      lon: longitude
      address: street_address
      borough: borough
allowlist:
  - access.nyc.gov
  - nyc.gov
prompt: |
  For "where do I apply for SNAP / food stamps in person" or "SNAP center/office near me",
  call nearest(category="snap_center", near=<the user's address>). Report ONLY the centers the
  tool returns and cite each one — these are the ~13 HRA SNAP application/enrollment centers.

  ALWAYS add that they can also apply online at ACCESS HRA (accesshra.nyc.gov) without visiting
  a center at all, or call 311. The finder does NOT surface per-center hours or a phone number,
  so tell users to confirm the hours before going, and NEVER invent hours, phone numbers, or
  eligibility rules. If the tool returns nothing or geocoding fails, don't guess a center —
  point the user to ACCESS HRA (accesshra.nyc.gov) and 311.
eval: eval.yaml
