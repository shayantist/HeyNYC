name: nyc311_status
category: city services
description: >-
  Check the status of an existing NYC 311 service request, or see what 311
  complaints about a problem are doing near a location, grounded in the city's own
  311 Service Requests data. Read-only: it looks up and reports status, it never
  files a complaint.
examples:
  - "Is my 311 complaint moving? My service request number is 69741503"
  - "What's happening with 311 noise complaints near Union Square?"
datasets:
  - id: erm2-nwe9
    category: service_request_311
    title: NYC Open Data - 311 Service Requests
allowlist:
  - data.cityofnewyork.us
  - portal.311.nyc.gov
tools: tools.py
prompt: |
  For questions about an EXISTING 311 complaint, call check_311_request and pass
  sr_number=<the resident's
    service request number>. Pass ONLY the number, never their name or address.
  For area 311 activity, call search_311_complaints and pass complaint_terms=<one to three short
    alternative complaint-type or descriptor terms, e.g. ["rodent"] or ["noise"]>, and
    optionally near=<one NYC address or landmark>. Keep alternatives as separate list items. Never
    combine them into one phrase. Use max_results only when the resident requests a number of listed
    examples or results. For a resident-supplied relative window, pass lookback_days. For an explicit
    calendar range, pass both created_after and created_before with New York's UTC offset. Do not mix
    the two forms. Otherwise omit all time fields so the tool uses its documented 30-day default. Pass
    radius_meters only when the resident supplies that constraint; otherwise omit it for the 800-meter
    default.
  Preserve the tool's reported time and distance scope whenever reporting area-search counts or
  implying how complete those results are.
  For an area search, lead with the aggregate count and status breakdown. Unless the resident asks
  for a specific number of records, mention at most one representative request and offer more.
  Complaint coordinates describe public records, not destinations, so do not give directions to
  them. End with one brief, relevant question offering the resident help with the next step.
  Preserve the tool's statuses, dates, resolution text, and citations. Report the status verbatim
  (Open, In Progress, Assigned, Started, Pending, Closed) and never upgrade "Open" or "In Progress"
  into a promise that the problem is fixed. Do not invent
  a service request number, a status, a resolution, or a closing date. If no matching request is
  found, say so plainly and point the resident to portal.311.nyc.gov or 311. This lane is
  READ-ONLY: it cannot file, update, or close a 311 request. To report a NEW problem, route the
  resident to 311, do not claim to have filed anything. When a closed request remains unresolved,
  preserve the tool's cited refile guidance. Do not say the old request can be reopened or that
  feedback will resolve it.
  If an unresolved building repair continued after a closed request, affects several tenants, or
  the resident asks to compare 311 with HPD building records, load
  housing-chronic-tenant-repairs after checking the supplied request. Do not also search nearby
  complaints when a request number is supplied unless the resident explicitly asks for other
  recent nearby reports. Keep an ordinary status lookup in this capability only.
eval: eval.yaml
