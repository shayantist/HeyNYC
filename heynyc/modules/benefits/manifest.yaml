name: benefits
category: benefits
description: >-
  Find NYC benefit programs (SNAP/food stamps, Fair Fares, HEAP, SCRIE/DRIE rent
  freeze, IDNYC, WIC, Cash Assistance, child care, and more): what they offer, who
  may roughly qualify, and how to apply, grounded in the city's Benefits & Programs
  dataset, with an "as of" date on every fact.
examples:
  - "I'm struggling to afford groceries, what can I get?"
  - "Am I eligible for SNAP?"
  - "Help me apply for food stamps"
  - "Are there NYC programs to help pay my rent?"
tools: tools.py
eval: eval.yaml
situations:
  - name: medicaid_termination_fair_hearing
    definition: >-
      A resident says Medicaid coverage, medical assistance, or an already authorized Medicaid
      service is ending, stopping, suspended, or reduced and asks what to do, whether care can
      continue, how to challenge the notice, or how to get language help. This includes a family
      member helping the person and follow-up questions in any language about a previously
      mentioned Medicaid termination notice.
    high_stakes: true
    query: >-
      New York Medicaid termination notice fair hearing aid continuing request phone language
      assistance current official
    urls:
      - https://regs.health.ny.gov/content/section-358-36-right-aid-continuing
      - https://www.health.ny.gov/health_care/medicaid/how_do_i_apply.htm
      - https://www.health.ny.gov/health_care/managed_care/plans/appeals/
      - https://www.health.ny.gov/health_care/managed_care/plans/appeals/guidance/final_iad_ac.htm
      - https://www.health.ny.gov/health_care/managed_care/plans/appeals/guidance/final_fad_ac.htm
    reminder: >-
      Start with the general Medicaid hearing page, aid-continuing regulation, and current DOH
      notice pages just retrieved. Use the general Medicaid page to distinguish an HRA or local
      eligibility decision from a NY State of Health decision and give its supported request phone.
      Explain that requesting before the notice's effective date may preserve aid-continuing rights, but OTDA
      decides and sends an acknowledgement saying whether benefits will continue. Do not promise
      that coverage or a particular medical visit will continue, because rules differ for coverage
      termination and reduction of an already authorized managed-care service. Ask what exact
      action and effective date the notice states, without requesting identifiers. Preserve the
      resident's language in the answer. If these pages answer the question, stop searching.
    focus_tools:
      - web_fetch
  - name: mixed_status_snap
    definition: >-
      A resident asks whether an undocumented parent or another ineligible household member can
      apply for SNAP for eligible children or other household members, whether a citizen child
      loses eligibility because of a parent's status, or whether immigration status blocks the
      whole household. This includes mixed-status household questions in any language.
    high_stakes: true
    query: >-
      NYC HRA SNAP immigration status undocumented parent apply for eligible household members
      citizen children current official
    urls:
      - https://www.nyc.gov/site/hra/help/snap-application-frequently-asked-questions.page
      - https://www.nyc.gov/site/hra/about/immigration-faqs.page
      - https://www.nyc.gov/site/hra/help/legal-services-for-immigrant-new-yorkers.page
      - https://access.nyc.gov/eligibility/
    reminder: >-
      Answer from the current HRA pages just retrieved. Separate the applicant from each household
      member: an ineligible or undocumented parent may apply for eligible children without applying
      for themself. Do not make a final eligibility determination. Offer the official ACCESS NYC
      eligibility screener. Do not claim that HeyNYC will run a screening workflow unless the
      resident explicitly requests or accepts it and that workflow's capability is loaded.
      Required outcomes: correct the household-member premise, offer the official screener, and
      give the retrieved immigration-safe legal-help route for case-specific advice. Keep the
      response in the resident's language and focused on the benefit they asked about. Do not add
      unrelated health programs. If the official pages answer the question, stop searching.
    focus_tools:
      - web_fetch
  - name: snap_work_rules
    definition: >-
      The resident's SNAP or food-stamp benefits are ending, being reduced, cut off, or
      sanctioned because of a work requirement or a time limit on food benefits for adults
      expected to work, they are being told they must prove work, job-training, or volunteer
      hours to keep food benefits, they need an exemption from that requirement, or they are
      trying to get food benefits restored after losing them to a work-rule penalty, including
      through a conciliation conference or a fair hearing. This covers the person losing the
      benefit and someone helping them recover it, in any language. Do not load for a generic
      question about whether SNAP may end when the resident has not mentioned a work rule,
      required hours, employment activity, an exemption, or a notice reason.
    high_stakes: true
    query: "NYC HRA SNAP ABAWD work requirements exemptions reporting activity restore benefits current"
    urls:
      - https://www.nyc.gov/main/services/snap-benefits/abawd
      - https://otda.ny.gov/hearings/faq.asp
      - https://portal.311.nyc.gov/article/?kanumber=KA-02943
      - https://finder.nyc.gov/foodhelp/
    reminder: >-
      This turn is about SNAP work-rule recovery. Use current official SNAP guidance and a
      supported human-help path. Include a fair-hearing path only when the resident asks to
      challenge a decision or says benefits were stopped or reduced, and only when retrieved
      evidence supports that route. Label unsupported details unverified and preserve the direct
      request URL instead of attaching
      the claim to unrelated evidence. Do not add a conditional appeal branch to a reporting-only answer.
      Use https://portal.311.nyc.gov/article/?kanumber=KA-02943 only for Fair Hearing request
      methods. Use the OTDA FAQ only for the SNAP-specific deadline. Do not use the NYC 311 page
      for a SNAP deadline. Fetch the NYC 311 page with
      evidence_scope="online phone fax mail in-person Fair Hearing request methods". Fetch the OTDA
      FAQ with evidence_scope="SNAP benefits denied stopped reduced Fair Hearing time limit 60 90 days".
      When the resident says they lack food or cannot eat, in any language, give immediate help.
      For immediate food, fetch https://finder.nyc.gov/foodhelp/ and use only that page for Food
      Help NYC claims. Put that action in the first actionable paragraph after one line of empathy,
      before eligibility, paperwork, or appeal details. Ask for a neighborhood or landmark, not a
      full address, before offering a nearest pantry, and call the pantry tool only after the resident
      provides one. Immediate food help is part of this situation, never an unrelated module. Spell out Able-Bodied Adults
      Without Dependents (ABAWD) on first use.
      Required outcomes: immediate food help when requested; how to check whether the rule applies;
      exemption examples and how HRA documents one; what to do when the rule applies, including work
      80 hours per month or an approved activity for its required monthly hours; the applicable reporting
      step supported by the retrieved source; and a Fair Hearing route only when the resident is challenging
      a stopped or reduced benefit. Do not omit a required outcome merely because another path may apply.
      Treat work, approved activities, and exemptions as alternatives, not cumulative requirements.
      Do not join them as if the resident must complete every path. Keep any reporting step attached
      only to the path the retrieved source says it applies to. For an approved activity, say it must
      meet the required number of hours each month unless the retrieved source gives a more exact
      requirement. Do not imply that any amount of participation is enough. Keep the notice condition
      and retrieved Fair Hearing routes in separate claim blocks. Do not call a page an online route
      unless its direct URL is registered for delivery. Use the Fair Hearings line only for requesting
      or discussing the hearing, never for choosing a work activity or exemption. Use a retrieved PACE
      or HRA route for activity and exemption help; if none was retrieved, say that route is incomplete.
      Preserve deadline qualifiers exactly as retrieved. If a source says denial notice, say denial notice,
      not a reduction notice or a broader category. State that condition as "If you received a denial
      notice..." without changing the resident's current case status, then put supported ways to request
      the hearing in a separate claim block.
      Beyond that, do not call or mention unrelated service modules unless the user separately
      asked for them. Start with the listed official pages. If they answer the resident's
      question, stop searching.
    focus_tools:
      - web_fetch
      - web_search
      - find_foodhelp_locations
  - name: snap_possible_loss
    definition: >-
      A resident asks whether SNAP or food-stamp benefits might end, stop, or be reduced without a
      notice reason, work-rule reason, or other specific change. This includes the same general
      uncertainty in any language.
    high_stakes: true
    query: >-
      NYC HRA SNAP possible benefit loss check case notice current official
    urls:
      - https://www.nyc.gov/site/hra/about/contact.page
    reminder: >-
      Use the current HRA pages just retrieved and answer in the resident's language. Do not guess
      why an individual case may change. Say that the message alone is not enough to determine the
      outcome, ask whether HRA sent a notice and what it says about the change and dates, and give
      the supported ACCESS HRA or DSS OneNumber route to check the case. Do not claim every notice
      contains a particular field. Do not request or repeat a case number or other identifying
      information. Do not detour into immigration, public charge, or eligibility screening unless
      the resident asks. Do not mention a possible reason for a change, including work rules, unless
      the resident provides it. If these pages answer the question, stop.
    focus_tools:
      - web_fetch
  - name: snap_denial_fair_hearing
    definition: >-
      A resident says a SNAP application or case was denied, stopped, reduced, or decided
      incorrectly and asks how to challenge the decision, without identifying a work-rule reason.
      This includes requests for an appeal, conference, hearing, or a person who can review the
      decision, in any language.
    high_stakes: true
    query: >-
      site:otda.ny.gov/hearings SNAP denial 90 days fair hearing request 1-800-342-3334
    urls: []
    reminder: >-
      Answer only from the current authoritative excerpts returned by the focused search. Explain
      the fair-hearing path and give one usable request route. State a deadline only when the
      excerpt explicitly names SNAP, and still tell the resident to read the date and instructions
      on their own notice. Food assistance is additional immediate help, never a replacement for
      challenging the decision. Do not call the page an online request route unless the excerpt
      explicitly says an online form is available. If the search answers the question, stop.
    focus_tools:
      - web_search
  - name: utility_shutoff
    definition: >-
      A resident says an electric, gas, or steam utility has sent a final disconnection notice,
      is threatening to shut service off soon, or has already disconnected service and asks for
      urgent help, protections, a payment arrangement, or a complaint route. This applies to any
      utility provider and includes the same situation described in any language.
    high_stakes: true
    query: >-
      New York residential utility final disconnection notice emergency complaint payment
      agreement medical emergency current official
    urls:
      - https://dps.ny.gov/file-complaint
      - https://dps.ny.gov/your-rights-residential-gas-electric-or-steam-customer-under-hefpa
      - https://dps.ny.gov/electric-utilities
    reminder: >-
      Use the current DPS pages just retrieved. Answer whether shutoff can proceed first: say you
      cannot verify an infant-specific protection from these pages and that this does not prove that
      none exists. Do not infer either way from the source's silence. State only the cited
      payment-agreement and certified-medical-emergency conditions that may prevent shutoff. Tell the
      resident to contact the utility first, using the notice or the official utility directory. Ask
      only for the supported payment agreement, not an invented urgent hold. If a final disconnection
      is scheduled within 48 or 72 hours and the utility has not resolved it, give the DPS emergency
      complaint route and its supported hours. Keep a child's presence separate from a conditional
      medical emergency protection. Cite each phone number and protection only from the page that
      states it. Put the provider phone and a payment-agreement rule in separate sentences, each with
      its own supporting citation. Do not search unrelated benefit programs unless the resident asks.
      If these pages answer the question, stop.
    focus_tools:
      - get_utility_shutoff_guidance
seeds:
  - https://access.nyc.gov
  - https://www.nyc.gov/assets/hra/ACCESSNYC/html/snapfaq/english.shtml
  - https://www.nyc.gov/main/services/snap-benefits/abawd
  - https://www.nyc.gov/site/hra/about/frequently-asked-questions-faq.page
  - https://www.nyc.gov/site/hra/about/claims-collections.page
  - https://www.nyc.gov/site/hra/help/snap-application-frequently-asked-questions.page
  - https://www.nyc.gov/site/hra/about/immigration-faqs.page
  - https://www.nyc.gov/site/hra/help/legal-services-for-immigrant-new-yorkers.page
  - https://www.nyc.gov/assets/hra/ACCESSNYC/pdf/SNAPKit/english/LDSS_4826A.pdf
  - https://opendata.cityofnewyork.us/
allowlist:
  - access.nyc.gov
  - nyc.gov
  - otda.ny.gov
  - opendata.cityofnewyork.us
prompt: |
  For questions about affording essentials or NYC benefit programs (SNAP/food stamps,
  Fair Fares, HEAP, SCRIE/DRIE rent freeze, IDNYC, WIC, Cash Assistance, child care,
  "help paying for X", "what am I eligible for"), call
  search_benefits(query=<the user's need in plain words>, category=<optional>).
  Report ONLY the programs the tool returns and cite each {cite:Sn} with its apply link.
  LANGUAGE: if the user is writing in a language other than English, pass lang=<that language's
  English name, e.g. "Spanish"> to search_benefits (and to screen_access_nyc_eligibility) so the tool returns
  the city's OFFICIAL translation of a program where the dataset has one, English by default and as
  the fallback. Prefer the tool's translated text over paraphrasing it yourself; keep program names,
  apply links, and "as of" dates exactly as returned. Call each result an official program listing
  unless its returned source identifies the responsible jurisdiction. Do not describe a state source
  as City information merely because the record came through the City's catalog.
  When the resident already requested the eligibility screening workflow, use search_benefits only
  to ground the estimate's limits and official path. Do not enumerate possible programs or
  application documents before the check. Ask only the next few required screening questions.
  BROAD / "what am I eligible for" QUERIES: do NOT just ask the user to narrow it down, most
  New Yorkers miss benefits because they don't know they exist. Call search_benefits to surface a
  few common programs across major needs (food, rent/utilities, cash, child care, transit) and present
  them. Offer to check likely eligibility together only when the deferred screen_access_nyc_eligibility
  workflow capability is loaded. Otherwise, give the official external screener route returned by
  the tool. Do not claim HeyNYC can run screening unless its deferred workflow capability is loaded.
  Do not append an uncited external screener or 311 route after a successful discovery result.
  Start collecting the minimum profile only after the resident accepts, not in the discovery answer.
  If screen_access_nyc_eligibility is unavailable, give the official external route returned by the tool.
  ELIGIBILITY: the tool's eligibility text is general, grounded guidance with an "as of"
  date, share it WITH that date and its caveats, but NEVER tell someone they definitely
  do or do not qualify, even if they give you income or household numbers. For a
  personalized determination, route them to the official screener at access.nyc.gov or 311.
  Always state the "as of" date for thresholds/deadlines and defer to official/311 for
  right-now certainty. If the tool returns no match or an error, say you don't have it and
  point to access.nyc.gov / 311, never invent a program, amount, or eligibility rule.
  DENIAL / PROBLEM (a benefit was denied, cut, reduced, or delayed, or the user disagrees with
  a decision): don't just sympathize. Identify what the notice says without asking for or echoing
  case numbers or other PII, then surface the human + appeal path. For a SNAP work-rule notice,
  retrieve the current official HRA or ACCESS NYC guidance before describing who may be affected,
  exemptions, qualifying activity, or reporting steps. Do not quote volatile rules from memory.
  For SNAP and most benefits, retrieve the current official FAIR HEARING path for challenging the
  decision. Use only a route supported by the retrieved source. Do not append an agency or 311
  route unless the evidence supports it. Point to the official page; never invent deadlines,
  forms, or outcomes. If you do not retrieve a usable step, say so.
  If food is needed now, also offer grounded nearby food pantries with scheduled availability and
  operator contact details. Present this as emergency access, not a replacement for lost benefits.
