name: benefits
category: benefits
description: >-
  Find NYC benefit programs (SNAP/food stamps, Fair Fares, HEAP, SCRIE/DRIE rent
  freeze, IDNYC, WIC, Cash Assistance, child care, and more): what they offer, who
  may roughly qualify, and how to apply, grounded in the city's Benefits & Programs
  dataset, with an "as of" date on every fact.
keywords:
  - benefits
  - snap
  - food stamps
  - fair fares
  - heap
  - scrie
  - drie
  - rent freeze
  - idnyc
  - wic
  - cash assistance
  - child care
  - help paying
  - do i qualify
  - what am i eligible for
  - eligibility
examples:
  - "I'm struggling to afford groceries, what can I get?"
  - "Am I eligible for SNAP?"
  - "Help me apply for food stamps"
  - "Are there NYC programs to help pay my rent?"
tools: tools.py
eval: eval.yaml
situations:
  - name: snap_work_rules
    definition: >-
      The resident's SNAP or food-stamp benefits are ending, being reduced, cut off, or
      sanctioned because of a work requirement or a time limit on food benefits for adults
      expected to work, they are being told they must prove work, job-training, or volunteer
      hours to keep food benefits, they need an exemption from that requirement, or they are
      trying to get food benefits restored after losing them to a work-rule penalty, including
      through a conciliation conference or a fair hearing. This covers the person losing the
      benefit and someone helping them recover it, in any language.
    high_stakes: true
    query: "NYC HRA SNAP ABAWD work requirements exemptions reporting activity restore benefits fair hearing current"
    urls:
      - https://www.nyc.gov/main/services/snap-benefits/abawd
      - https://access.nyc.gov/snap-work-requirements/
      - https://www.nyc.gov/site/hra/about/frequently-asked-questions-faq.page
      - https://otda.ny.gov/hearings/request/
    reminder: >-
      This turn is about SNAP work-rule recovery. Use current official SNAP guidance and the
      human or fair-hearing path. When the resident says they lack food or cannot eat, in any
      language, ALWAYS offer the nearest food pantry via the tool: immediate food help is part
      of this situation, never an unrelated module. Beyond that, do not call or mention
      unrelated service modules unless the user separately asked for them.
    focus_tools:
      - official_sources
      - web_search
      - recent_developments
      - benefits_search
      - nearest_food_pantry
      - geocode
      - nearest
      - screen_eligibility
      - prepare_snap_application
seeds:
  - https://access.nyc.gov
  - https://www.nyc.gov/assets/hra/ACCESSNYC/html/snapfaq/english.shtml
  - https://www.nyc.gov/main/services/snap-benefits/abawd
  - https://www.nyc.gov/site/hra/about/frequently-asked-questions-faq.page
  - https://www.nyc.gov/site/hra/about/claims-collections.page
  - https://access.nyc.gov/snap-work-requirements/
  - https://otda.ny.gov/programs/snap/work-requirements.asp
  - https://otda.ny.gov/policy/directives/2017/
  - https://otda.ny.gov/hearings/request/
  - https://opendata.cityofnewyork.us/
allowlist:
  - access.nyc.gov
  - nyc.gov
  - otda.ny.gov
  - opendata.cityofnewyork.us
prompt: |
  For questions about affording essentials or NYC benefit programs (SNAP/food stamps,
  Fair Fares, HEAP, SCRIE/DRIE rent freeze, IDNYC, WIC, Cash Assistance, child care,
  "help paying for X", "what am I eligible for"), call
  benefits_search(query=<the user's need in plain words>, category=<optional>).
  Report ONLY the programs the tool returns and cite each {cite:Sn} with its apply link.
  LANGUAGE: if the user is writing in a language other than English, pass lang=<that language's
  English name, e.g. "Spanish"> to benefits_search (and to screen_eligibility) so the tool returns
  the city's OFFICIAL translation of a program where the dataset has one, English by default and as
  the fallback. Prefer the tool's translated text over paraphrasing it yourself; keep program names,
  apply links, and "as of" dates exactly as returned. Call each result an official program listing
  unless its returned source identifies the responsible jurisdiction. Do not describe a state source
  as City information merely because the record came through the City's catalog.
  BROAD / "what am I eligible for" QUERIES: do NOT just ask the user to narrow it down, most
  New Yorkers miss benefits because they don't know they exist. Call benefits_search to surface a
  few common programs across major needs (food, rent/utilities, cash, child care, transit) and present
  them. When screen_eligibility is available, end by offering to check likely eligibility together.
  Do not append an uncited external screener or 311 route after a successful discovery result.
  Start collecting the minimum profile only after the resident accepts, not in the discovery answer.
  If screen_eligibility is unavailable, give the official external route returned by the tool.
  ELIGIBILITY: the tool's eligibility text is general, grounded guidance with an "as of"
  date, share it WITH that date and its caveats, but NEVER tell someone they definitely
  do or do not qualify, even if they give you income or household numbers. For a
  personalized determination, route them to the official screener at access.nyc.gov or 311.
  Always state the "as of" date for thresholds/deadlines and defer to official/311 for
  right-now certainty. If the tool returns no match or an error, say you don't have it and
  point to access.nyc.gov / 311, never invent a program, amount, or eligibility rule.
  DENIAL / PROBLEM (a benefit was denied, cut, reduced, or delayed, or the user disagrees with
  a decision): don't just sympathize. Identify what the notice says without asking for or echoing
  case numbers or other PII, then surface the human + appeal path. For a SNAP work-rule notice,
  retrieve the current official HRA or ACCESS NYC guidance before describing who may be affected,
  exemptions, qualifying activity, or reporting steps. Do not quote volatile rules from memory.
  Tell them they can call
  311 or contact the agency handling the case (e.g. HRA for SNAP / Cash Assistance), and that
  for SNAP and most benefits they have the right to request a FAIR HEARING to challenge the
  decision (New York State's fair hearing process). Point to the official page; never invent
  deadlines, forms, or outcomes, if you don't have the specific step, say so and route to 311.
  If food is needed now, also offer grounded nearby food pantries with scheduled availability and
  operator contact details. Present this as emergency access, not a replacement for lost benefits.
