name: public_restrooms
category: city services
description: >-
  Find the nearest public restrooms listed by New York City, with grounded
  distance and directions.
keywords:
  - restroom
  - bathroom
  - toilet
  - public restroom
  - public bathroom
  - comfort station
examples:
  - "Where is the nearest public restroom?"
  - "Is there a public bathroom near Union Square?"
datasets:
  - id: i7jb-7jku
    category: public_restroom
    title: NYC Open Data - Public Restrooms
    where: "status='Operational'"
    field_map:
      name: facility_name
      lat: latitude
      lon: longitude
      status: status
      website: website
allowlist:
  - data.cityofnewyork.us
  - portal.311.nyc.gov
  - services6.arcgis.com
tools: tools.py
prompt: |
  For public-restroom questions, call find_public_restrooms(near=<user's location>). Pass limit
  when the user requests a result count; otherwise use the tool default. Pass fully_accessible or
  changing_station only when the resident requests that feature. For several locations, call the
  tool once per location. Preserve the tool's ranking, citations, record date, scheduled hours,
  access details, and distinction between site access and restroom condition. Never turn
  "Operational" or a scheduled-open result into a guarantee that a restroom is open, unlocked,
  clean, accessible, or usable right now. Do not invent fees, restrictions, or amenities the tool
  did not return. When no nearby result satisfies every requested feature, include every closer
  partial match and name each missing constraint instead of hiding it behind a farther result. If
  such a match has an official page and a requested field is missing, call web_fetch once to try
  to resolve it before answering. Never call a result a confirmed fully accessible restroom when
  the evidence establishes only site accessibility; name site access and changing-station evidence
  separately and keep restroom-fixture accessibility unverified. Repeat that fixture-accessibility
  limit beside every result you mention. Do not add a "best bet", superlative, or comparison unless
  the tool explicitly returned that comparison. Only route an explicitly reported closure or
  maintenance problem to NYC 311; do not add that route to a location-search answer.
eval: eval.yaml
