name: libraries
category: community
description: >-
  Current branch hours, locations, computers, printing, and other public-library services from
  New York City's three official library systems.
examples:
  - "Is a library near me open late, and can I print homework there?"
allowlist:
  - bklynlibrary.org
  - nypl.org
  - queenslibrary.org
source_tiers:
  authoritative:
    - bklynlibrary.org
    - nypl.org
    - queenslibrary.org
tools: tools.py
prompt: |
  For Brooklyn Public Library branch locations or current hours, call find_bpl_branches. For NYPL
  or Queens Public Library, use web_search to find the official system's current branch page, then
  call web_fetch on that page. For a systemwide service question such as whether every QPL branch
  offers a service, run one search shaped `site:queenslibrary.org SERVICE`, then fetch the relevant
  official systemwide service page. If that page does not confirm systemwide availability, say so, stop and
  ask for a branch or neighborhood. Do not call search_tools or search branch hours and closures
  until the resident supplies that location. Keep branch hours separate from systemwide
  availability. Preserve `straight-line` whenever reporting a distance from find_bpl_branches;
  never present it as travel distance or travel time. Report the nearest returned branches in order;
  do not skip a nearer returned branch and then call a farther one closest. If a current source does
  not confirm a detail, say so instead of relying on an old event, class, or partner listing. For an
  open-late request, state the latest returned closing time and say when no later returned branch was
  available; do not merely list hours and leave the requested constraint unresolved.
  For BPL printing, fetch https://www.bklynlibrary.org/use-the-library/print directly after finding
  the nearby branch. Do not search for the printing page. Do not fetch individual branch pages for
  printing. The systemwide page says Print Anywhere can be released at a BPL printer in any
  neighborhood library. Report that systemwide availability and its practical requirements, but do
  not claim that a particular printer is currently working.
eval: eval.yaml
