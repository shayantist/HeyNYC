name: cooling_centers
category: health
description: >-
  Find activated NYC cooling centers and other currently listed Cool Options,
  with current City-listed hours, access details, distance, and directions.
keywords:
  - cooling
  - cooling center
  - heat
  - hot
  - heat wave
  - heat emergency
  - air conditioning
  - ac
  - beat the heat
  - stay cool
  - library
  - older adult center
examples:
  - "Where's the nearest cooling center?"
  - "It's too hot, where can I cool off indoors today?"
official_link: https://finder.nyc.gov/coolingcenters/
datasets:
  - source: arcgis
    url: https://services6.arcgis.com/yG5s3afENB5iO9fj/arcgis/rest/services/Cool_Options/FeatureServer/0
    category: cooling_center
    record_id_field: NYCEM_ID
    title: NYC Emergency Management - Cool Options
    where: "Finder_status='OPEN' AND Space_type='Cooling Center'"
    field_map:
      name: Facility_name
      lat: lat
      lon: lon
      address: Address
      borough: Borough_name
      status: Finder_status
      phone: Phone
seeds:
  - https://portal.311.nyc.gov/article/?kanumber=KA-02663
allowlist:
  - finder.nyc.gov
  - services6.arcgis.com
tools: tools.py
prompt: |
  For definitions or access-policy questions that do not include a resident location, retrieve
  the official NYC311 guidance before answering and ask for a neighborhood, address, or landmark
  before ranking nearby sites.
  For heat-relief questions, call find_cool_options. Use kind="cooling_center" when the user
  specifically requests an activated cooling center, kind="indoor" when they need indoor A/C,
  and kind="all" for a general place to cool off. Pass `visit_date` as an ISO date whenever the resident
  names a day or date; omit it when no specific date was requested. Pass `visit_time` as 24-hour
  New York local time whenever the resident names a visit time. The tool, not the model, computes
  scheduled status for that time. Set `open_now_only=true` only when the resident explicitly asks
  for a place open right now. Pass `max_results` only when the resident explicitly requests a
  count; otherwise omit it and let the tool use its default. Use
  audience="not_age_restricted" when the resident needs options without a City-listed age
  restriction, including when asking for children. This field does not prove child-specific
  amenities or suitability.
  Preserve the tool's distinction between activated cooling centers and other Cool Options,
  and report its scheduled status, hours, access details, and citations.
  When the resident cannot walk far, preserve the tool's origin-to-destination Directions link.
  Do not claim that a walking or transit route is accessible unless retrieved evidence proves it.
  City-listed weekly hours are not a guarantee of holiday hours or entry, so preserve the
  call-ahead warning.
  If no activated center is returned, offer other indoor Cool Options instead of merely linking
  to the finder. Do not invent capacity, occupancy, amenities, or emergency status.
eval: eval.yaml
