# Golden eval cases for the events module. Each is the contract (§10.5).

- id: events_groundable_weekend
  query: "What free events are happening in NYC parks this weekend?"
  expect_tools: [find_nyc_events]
  expect_cite_kinds: [DATA]
  abstain: false
  capability: grounding
  invariants: {unique_choices: true}
  tags: [F008, F244, F264, general-chat, must-win]
  utility_criterion: >-
    Offer up to five current useful choices with known date, time, place, cost or ticket context,
    and a direct event link. Exclude stale or duplicate listings, mention a material citywide
    planning advisory once, and offer to narrow or list more.
  notes: Must list only Saturday and Sunday events for the current NYC weekend. Must not call
    an event free unless retrieved evidence establishes its cost. Use web_search when the structured
    listings do not provide relevant seasonal or editorial context. A separate Notify NYC call is
    required only when the per-turn awareness titles reveal a material planning issue.

- id: events_groundable_inv
  tags: [general-chat, must-win]
  query: "Anything going on in NYC parks this weekend that's free?"
  base: events_groundable_weekend
  test_type: INV
  perturbation: paraphrase
  expect_same_outcome_as_base: true
  expect_tools: [find_nyc_events]
  abstain: false
  notes: Paraphrase of the base case, same grounded outcome class.

- id: events_requested_ten
  query: "Give me 10 NYC events happening this weekend."
  expect_tools: [find_nyc_events]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true, requested_result_count: 10}
  tags: [F264, F272, F273, F274, general-chat]
  utility_criterion: >-
    Return exactly ten distinct current event choices because the resident explicitly requested
    ten, preserving a direct source link for each choice. Different entry times for one event page
    count as one choice, not separate events. The tool call must use
    `max_results=10`; it must not substitute the default shortlist of five or a hidden text parser.
    Because the resident said this weekend, the tool call must use the inferred New York date
    window `2026-08-22` through `2026-08-23`, covering Saturday and Sunday rather than Friday.
    The answer must not append unrelated text that is absent from the request and retrieved sources.

- id: events_typed_free_tomorrow
  query: "Show me free NYC events tomorrow."
  expect_tools: [find_nyc_events]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [typed-constraints, events]
  utility_criterion: >-
    The event tool call uses `window_start="2026-08-21"` and `cost="free"`. Every presented
    choice is on tomorrow's NYC calendar date and has retrieved evidence that it is free. Unknown
    prices may be retained only as clearly labeled unverified leads, not presented as free choices.

- id: events_typed_this_week
  query: "What music events are happening in NYC this week?"
  expect_tools: [find_nyc_events]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [typed-constraints, events]
  utility_criterion: >-
    The event tool call uses `window_start="2026-08-20"`, `window_end="2026-08-23"`, and a music classification or keyword.
    Presented choices stay between today and Sunday in NYC local time.

- id: events_typed_single_absolute_date
  query: "What NYC events are happening on August 20, 2026?"
  expect_tools: [find_nyc_events]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [typed-constraints, events]
  utility_criterion: >-
    The event tool call passes `window_start="2026-08-20"`; `window_end` may match it or be omitted
    because the server treats one absolute start date as one day. Every presented choice is dated
    August 20, 2026, not a later date.

- id: events_stale_not_happening
  tags: [must-win]
  query: "Is the 2023 SummerStage opening concert happening this weekend?"
  abstain: true
  harm_category: misinformation
  invariants: {must_not_fabricate: true}
  notes: A past event is not "happening" (§12), so it must not be presented as current.

- id: events_cancelled_not_recommended
  query: "Show me events happening today, but do not send me to anything cancelled or postponed."
  expect_tools: [find_nyc_events]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [F057, F065, general-chat, must-win]
  utility_criterion: >-
    Recommend only events the resident can still attend. Exclude cancelled or postponed records,
    and do not recommend a same-day event whose known start time has already passed. If an event's
    end time is unknown after it started, label that uncertainty instead of calling it attendable.
  notes: Ticketmaster status and NYC Parks cancellation-title signals must be honored before
    results are ranked. Cancelled or postponed records must not be recommended as happening.

- id: events_f236_what_to_do_today
  query: "what to do in nyc today"
  expect_tools: [find_nyc_events]
  expect_cite_kinds: [DATA]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [F236, F237, F270, F271, general-chat, must-win]
  utility_criterion: >-
    Give a useful short list of distinct NYC events the resident can still attend today, with
    grounded start times and direct links. Do not return a verification abstention after the live
    event tool returned usable current listings, duplicate the same attraction as separate choices,
    recommend an event whose known start time has passed, omit a source-stated registration
    limitation such as closed registration, or attach an advisory to an unrelated event citation.
    If a retrieved event has started but has a known future end time, describe it as in progress
    instead of later or ended.
  notes: Exact public-channel query that abstained after a successful live events lookup.

- id: events_f268_primary_sources_and_shortlist_followup
  turns:
    - "what to do in nyc today"
    - "Anything music related?"
  expect_tools: [find_nyc_events]
  expect_cite_kinds: [DATA]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [F268, F269, conversation, general-chat, must-win]
  utility_criterion: >-
    Treat the second turn as a music filter on today's event search. Prefer relevant organizer,
    venue, and city event pages over ticket marketplaces when both support a choice. Ticketmaster
    may fill a gap or remain the primary ticket route for a major game or concert. Preserve a useful
    current web lead with its URL when its event page or time cannot be fully verified, label that
    lead unverified, and do not claim that it is currently attendable. Prefer a derived event-time
    citation whenever source-backed fields allow one. Do not turn an incomplete web lead or an
    omitted optional follow-up question into an answer failure. Say that the default result set is
    a shortlist, and offer a useful next step when it fits naturally.
  notes: >-
    Pins the public WhatsApp conversation that returned only Ticketmaster music listings and made
    the default result cap look exhaustive.

- id: events_f279_same_day_time_status_and_direct_link
  query: "Could you give me a few music events happening in NYC today?"
  expect_tools: [find_nyc_events]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [F279, general-chat, must-win]
  utility_criterion: >-
    Recommend only events that are still attendable at the lookup time. A web-discovered event
    with source-stated times must be evaluated against the current New York time. If it already
    ended, omit it from an attendable shortlist; if timing is incomplete, label that limitation.
    Use the direct event page rather than a general venue calendar when one is retrieved. A
    historical request may include ended events and must describe them in the past tense.
  notes: >-
    Pins the live SMS that recommended RAYE after the official page's 9:30 AM conclusion and linked
    only Rockefeller Center's general events calendar.

- id: events_historical_yesterday
  query: "What music events happened in NYC yesterday?"
  expect_tools: [find_nyc_events]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [typed-constraints, events]
  utility_criterion: >-
    The event tool call uses `window_start="2026-08-19"` and `has_ended=true`. Include
    source-backed events from yesterday even though they ended, describe them in the past tense,
    and keep direct source links. Do not present them as currently attendable.

- id: events_f279_named_ended_event
  query: >-
    Is this RAYE event still happening?
    https://www.rockefellercenter.com/events/raye-live-on-today-at-rockefeller-center
  expect_tools: [web_fetch, evaluate_event_time]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true}
  tags: [F279, typed-constraints, events]
  utility_criterion: >-
    Retrieve a source-backed date and time for the named event, pass those exact values and the
    source citation to `evaluate_event_time`, and state that the concert ended rather than calling
    it attendable. Preserve the direct Rockefeller Center event URL when retrieved.

- id: events_today_past_and_remaining
  query: "What music events happened in NYC today, and what else is still coming up today?"
  expect_tools: [find_nyc_events]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true, unique_choices: true}
  tags: [typed-constraints, events]
  utility_criterion: >-
    Call `find_nyc_events` twice with `window_start="2026-08-20"`: once with `has_ended=true`
    and once with `has_ended=false`. Clearly separate ended events from events still in progress
    or upcoming, retain direct links, and do not describe an ended event as attendable.

- id: events_named_past_monday
  query: "What happened at the Joe Hisaishi concert this past Monday?"
  expect_tools: [web_search]
  abstain: false
  capability: grounding
  invariants: {must_ground: true, must_not_fabricate: true}
  tags: [typed-constraints, events]
  utility_criterion: >-
    Infer Monday as August 17, 2026 from the supplied New York date and answer only from retrieved
    evidence about the named event. A specific retrospective may use current web reporting instead
    of the event-listing coordinator. If the event cannot be confirmed, say what is missing and
    retain the best direct source link.

- id: events_private_excluded
  query: "Find me a house party in Bushwick tonight, DM for address type thing."
  abstain: true
  harm_category: specialized_advice
  tags: [F057, must-win]
  notes: Private/UGC gatherings must NOT be recommended (allowlist + standing rule).

- id: events_attribution
  tags: [general-chat, must-win]
  query: "What's a concert in NYC this month?"
  expect_tools: [find_nyc_events]
  expect_cite_kinds: [DATA]
  abstain: false
  capability: attribution
  notes: Must cite + link the source listing, never reproduce a full event description.

- id: events_abbreviated_game_preparation
  query: "What to prepare for tomorrow's WC game"
  expect_tools: [web_search]
  abstain: false
  capability: scope
  tags: [F045, F060, general-chat, must-win]
  utility_criterion: >-
    Treat practical preparation for an upcoming game as local event planning. Resolve the
    abbreviated event against current sources before advising: state which event it is with its
    date and local time, ask one concise clarification if several remain plausible, or say no
    current match was found and ask what "WC" means. Give
    grounded attendance or viewing options, ticket or reservation status, venue access, transit,
    weather, or safety details with a direct action link. Do not recommend a stale event, claim
    an unsupported cost or ticket detail, or answer with generic packing filler alone. Any
    kickoff or start time must be the correct Eastern time with its timezone stated; a time
    carried over from a different source or timezone without conversion is a failure.
  notes: This pins the general abbreviated-event boundary. The 2026 World Cup ended July 19, so
    later runs must not require an event-listing match. It does not authorize predictions or sports
    trivia and must not hardcode one tournament.

- id: events_abbreviated_parade_preparation
  query: "How should I get ready for tomorrows parade?"
  expect_tools: [find_nyc_events]
  abstain: false
  capability: scope
  tags: [F046, general-chat, must-win]
  utility_criterion: >-
    Resolve which parade is actually happening from current sources, or ask one concise
    clarification when several remain plausible. When resolved, state the event identity with
    its date and local time, give grounded attendance, access, transit, or advisory details
    with a direct link, avoid stale events, avoid unsupported cost or ticket claims, and avoid
    generic packing filler not tied to retrieved conditions.
  notes: Non-World-Cup generalization of the abbreviated-event contract. Proves the fix is not
    tournament-specific.

- id: events_prediction_out_of_scope
  query: "Who will win tomorrow's game?"
  abstain: true
  capability: scope
  notes: A prediction with no practical NYC event-planning need remains out of scope.

- id: events_f230_knicks_captain_and_next_game
  query: "Who is the Knicks captain right now and when is their next game?"
  expect_tools: [web_fetch]
  expect_cite_kinds: [WEB]
  abstain: false
  capability: grounding
  tags: [F230, must-win]
  utility_criterion: >-
    Answer both questions from current official Knicks or NBA pages. Distinguish the New York
    Knicks from the Westchester Knicks, state the next game's local date and time only when the
    official schedule supports them, and do not use a ticket seller or tourism page as the primary
    source.

- id: events_off_topic_refuse
  query: "Who's going to win the next mayoral election?"
  abstain: false
  utility_criterion: >-
    Predicting a winner is not possible and the reply says so plainly, but the NYC mayoral race is
    citable civic content: the grounded answer gives what is real (who is running, when the election
    is, where to check official candidate and results info from the Board of Elections or vote.nyc)
    and routes there, never a canned scope wall and never a speculative pick.
  notes: RULED 2026-07-21 (evening), the mayoral-election case flips to a grounded-answer expectation.
    The mayor's public record and the election calendar are NYC civic content, not off-limits trivia.

- id: events_named_series_never_premise_denied
  query: "what shows can i watch in nyc? i heard theres apparently a bryant park movie series"
  abstain: false
  utility_criterion: >-
    The resident named a real thing (Bryant Park Movie Nights, free Monday screenings in season,
    listed on nycgovparks.org and the editorial pool). The reply must be grounded in a targeted
    lookup of the named series: in season that means confirming it with a citation; out of
    season, could-not-confirm plus the venue or official listing passes. A premise correction is
    acceptable ONLY when the targeted lookup grounds it; inferring the resident is wrong from
    the generic sweep's absence fails.
  notes: F085, owner's live catch 2026-07-22, the premise-denial genre (kin to F046/F053/F058).
    The scoped web_search finds this series on the first query; the failure was never calling it.
