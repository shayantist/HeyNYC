name: world_cup
category: events
description: >-
  FIFA World Cup 2026 in the NYC/NJ area, official fan events, fan festivals, and
  watch parties (final 2026-07-19 at MetLife). Seasonal: retire ~2 weeks after by
  deleting this folder.
keywords:
  - world cup
  - fifa
  - soccer
  - football
  - match
  - watch party
  - fan zone
  - fan festival
  - fan fest
examples:
  - "Where can I watch the World Cup in NYC?"
  - "Any World Cup fan events near me?"
ticketmaster_keyword: world cup
# Lifestyle discovery under events: same stakes tier as its parent (RULED 2026-07-18).
official_only: false
seeds:
  - https://www.nynjfwc26.com/fan-events
  - https://portal.311.nyc.gov/article/?kanumber=KA-03721
  - https://www.nyc.gov/mayors-office/news/2026/06/mayor-mamdani--borough-presidents-unveil-roster-of-over-100-free
  - https://www.nyc.gov/mayors-office/news/2026/06/mayor-mamdani--governor-hochul--fifa-and-nynj-host-committee-ann
  - https://www.nyctourism.com/worldcup26/
  - https://inside.fifa.com/tournaments/mens/worldcup/canadamexicousa2026/media-releases/fifa-world-cup-26-tm-final-to-be-held-in-new-york-new-jersey-mexico-city-to
  - https://www.worldcup.nyc/
allowlist:
  - nynjfwc26.com
  - worldcup.nyc
  - fifa.com
  - rockefellercenter.com
  - brooklynbridgepark.org
  - globalcitizen.org
source_tiers:
  authoritative:
    - nynjfwc26.com
    - nyctourism.com
    - fifa.com
    - rockefellercenter.com
    - brooklynbridgepark.org
    - globalcitizen.org
  editorial:
    - worldcup.nyc
    - 6sqft.com
    - cbsnews.com
prompt: |
  World Cup 2026 topic notes (the parent events guidance already covers which tools to
  call; the coordinator keyword is "world cup"): ground official fan-event details with
  web_search using prefer=["nynjfwc26.com","worldcup.nyc"], then fetch the selected
  official page when its excerpt lacks the needed detail. Some venues (Central Park,
  Brooklyn Bridge Park) require a free
  ticket; always link the official page, and never invent match results, scores, or watch
  parties that aren't grounded.
eval: eval.yaml
