name: events
category: events
description: >-
  Find current NYC event choices by date, place, audience, or topic, grounded in
  live structured listings and current web sources with direct links.
examples:
  - "What's happening in NYC this weekend?"
  - "Any free events tonight?"
seeds:
  - https://www.nyctourism.com/events/
  - https://www.nyc.gov/events
source_tiers:
  authoritative:
    - nyc.gov
    - nycgovparks.org
    - nyctourism.com
    - cityofnewyork.us
    - nba.com
    - cityparksfoundation.org
    - msg.com
  editorial:
    - donyc.com
    - timeout.com
    - secretnyc.co
    - nycforfree.co
    - theinfatuation.com
    - eater.com
    - cntraveler.com
    - bkmag.com
  community:
    - eventbrite.com
    - lu.ma
    - luma.com
    - ma.to
    - partiful.com
prompt: |
  Use `web_search` for event discovery with the resident's own wording. Start with one search.
  Use `web_fetch` only when a selected source excerpt lacks a required detail.
  After fetching selected event pages, use `extract_events` for date and time checks.
  Recommend only source-backed choices matching the requested New York date and time window. Do not
  present an ended event as currently attendable. Keep incomplete leads as a plain limitation.
  Never call an event free unless a cited source says it is free. Include source-stated age and entry
  restrictions. An advance listing establishes what was scheduled, not what occurred. A related URL
  without event details is not evidence. For similarity requests, explain the source-established
  overlap and say when the match is loose. Never turn separate recurring schedules into one combined
  date range.
eval: eval.yaml
tools: extraction.py
