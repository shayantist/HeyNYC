name: events
category: events
description: >-
  Find current NYC event choices by date, place, audience, or topic, grounded in
  live structured listings and current web sources with direct links.
keywords:
  - events
  - what's on
  - what's happening
  - this weekend
  - tonight
  - concert
  - festival
  - free things
  - things to do
  - pop-up
examples:
  - "What's happening in NYC this weekend?"
  - "Any free events tonight?"
seeds:
  - https://www.nyctourism.com/events/
  - https://www.nyc.gov/events
# RULED 2026-07-18: events is lifestyle discovery, so it carries a governed editorial pool
# (the sources that actually answer "where do French fans watch") alongside official listings.
# Official modules keep the default official_only: true and cannot declare these tiers.
official_only: false
allowlist:
  - nyctourism.com
  - nycgovparks.org
  - timeout.com
  - secretnyc.co
  - nycforfree.co
  - theinfatuation.com
  - eater.com
  - cntraveler.com
  - bkmag.com
  - nba.com
source_tiers:
  authoritative:
    - nyc.gov
    - nycgovparks.org
    - nyctourism.com
    - cityofnewyork.us
    - nba.com
  editorial:
    - timeout.com
    - secretnyc.co
    - nycforfree.co
    - theinfatuation.com
    - eater.com
    - cntraveler.com
    - bkmag.com
  community:
    - eventbrite.com
prompt: |
  For requests for event choices, such as "what's on," festivals, or things to do this weekend,
  call whats_on_events. It coordinates live Ticketmaster, NYC Parks, and NYC Permitted Events
  listings and, for broad time-sensitive questions, adds current official, editorial-guide, and
  news context. Do not use it for general facts merely because they concern sports, music, or
  entertainment. web_search remains available for current context, named-event details, and gaps
  the structured listings do not cover. Pass `keyword` (the topic), optional `classification`
  (Music/Sports/Arts & Theatre), `borough`, and `audience="kids"` when the resident asks for
  children's events. The audience filter returns only rows with a source-backed kids label. Do not
  repeat the coordinator's searches unless a requested detail is still missing. When the user asks for free events, do not call an
  event free unless the retrieved source explicitly establishes its cost; the NYC Parks feed
  itself has no price field. Say when cost could not be confirmed. Every normal turn already has
  a compact index of today's Notify NYC titles. If one materially affects the requested plan, call
  `nyc_advisories` for its full text and citation before mentioning it. Web results are tagged by
  trust tier: state authoritative/editorial sources
  plainly, but prefix any community-tagged (⚠️) result with "community-posted, confirm before
  you go." Never
  recommend private-residence or "DM for address" gatherings, and never invent an event
  that isn't grounded, if nothing comes back, say so and link the official source.
tools: tools.py
eval: eval.yaml
