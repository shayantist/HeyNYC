name: immigration
category: immigration
description: >-
  Immigration help for New Yorkers: what a change to a program like Temporary Protected Status
  actually says and when it was published, free immigration legal help in NYC and New York State,
  what city sanctuary rules cover and what they do not, know-your-rights information from current
  official material, and how to prepare a report of federal enforcement activity you witnessed
  through an official channel. Answers come from official sources retrieved at answer time and are
  cited; nothing here decides anyone's immigration status.
keywords:
  - immigration
  - immigrant
  - TPS
  - Temporary Protected Status
  - Haitian TPS
  - Haiti TPS
  - Syrian TPS
  - Syria TPS
  - work permit
  - work authorization
  - immigration lawyer
  - free immigration lawyer
  - immigration legal help
  - ActionNYC
  - know your rights
  - ICE
  - ICE at my door
  - immigration agents
  - enforcement activity
  - sanctuary city
  - sanctuary policy
  - Executive Order 13
  - report ICE
  - report federal agents
  - deportation
  - undocumented
examples:
  - "Did the Supreme Court decision end TPS for Haitians?"
  - "Where can I get a free immigration lawyer in NYC?"
  - "What does NYC being a sanctuary city actually mean for me?"
  - "ICE is knocking on my door, what are my rights?"
  - "I saw immigration agents detain someone on my block, how do I report it?"
