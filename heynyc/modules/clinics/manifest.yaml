name: clinics
category: health
description: >-
  Find NYC health care, coverage, and official public charge guidance, including whether
  using a benefit could affect a green card or immigration case. Also find nearby community
  health centers and NYC Care sites, Emergency Medicaid, and emergency-care rights.
examples:
  - "Where can I see a doctor without insurance?"
  - "Free clinic near me"
  - "I'm undocumented and sick, where can I go?"
  - "I'm undocumented and pregnant with no insurance, what can I do?"
  - "Will using SNAP or Medicaid count against my green card under public charge?"
datasets:
  # FQHC spine, HRSA Primary Health Care service-delivery sites (live, tokenless ArcGIS MapServer
  # layer; behaves like a FeatureServer for /query). The bespoke find_clinics tool queries this
  # directly (with the NYC-active where-clause) AND merges the bundled NYC Care seed; this binding is
  # declared so the source is discoverable + citable. record_id_field = OBJECTID (row-addressing).
  - source: arcgis
    url: https://gisportal.hrsa.gov/server/rest/services/HealthCareFacilities/PrimaryHealthCareFacilities_FS/MapServer/0
    category: fqhc_site
    record_id_field: OBJECTID
    title: HRSA Primary Health Care service-delivery sites
    where: "HCC_STATUS_DESC='Active' AND SITE_STATE_ABBR='NY' AND COUNTY_NM IN ('Bronx','Kings','New York','Queens','Richmond')"
    field_map:
      name: SITE_NM
      lat: lat
      lon: lon
      address: SITE_ADDRESS
      borough: COUNTY_NM
      phone: SITE_PHONE_NUM
tools: tools.py
eval: eval.yaml
seeds:
  - https://access.nyc.gov/programs/nyc-care/
  - https://www.nyc.gov/site/doh/health/health-topics/immigrant-health.page
  - https://www.health.ny.gov/health_care/medicaid/emergency_medical_condition_faq.htm
  - https://www.cms.gov/priorities/your-patient-rights/emergency-room-rights
  - https://www.nyc.gov/site/immigrants/legal-resources/public-charge-rule.page
  - https://www.nyc.gov/site/immigrants/legal-resources/moia-immigration-legal-support-hotline.page
  - https://www.poison.org/articles/simpler-acetaminophen-dosing-for-kids
  - https://www.nyc.gov/site/hra/help/legal-services-for-immigrant-new-yorkers.page
  - https://www.justice.gov/eoir/check-case-status
  - https://www.uscis.gov/i-765
allowlist:
  - poison.org
  - hrsa.gov
  - access.nyc.gov
  - nyccare.nyc
  - nychealthandhospitals.org
  - nyc.gov
  - health.ny.gov
  - justice.gov
  - uscis.gov
  - cms.gov
source_tiers:
  authoritative:
    - nyccare.nyc
    - nychealthandhospitals.org
    - poison.org
prompt: |
  For "I need to see a doctor" when the person has no insurance, can't afford care, is on a low
  income, or is worried about immigration status (doctor / clinic / free clinic / community health
  center / sliding scale / NYC Care / "I'm undocumented and sick"), call
  find_clinics(near=<the user's NYC address, neighborhood, or ZIP>).

  LEAD WITH REASSURANCE. This is often a scared, uninsured, or undocumented New Yorker. Open by
  telling them plainly that these places serve everyone, community health centers see all patients
  regardless of ability to pay, and NYC Health + Hospitals / NYC Care don't ask about immigration
  status ("seek care without fear"). Be warm and direct.

  Report ONLY the sites the tool returns and cite each {cite:Sn}. Each site carries a name, address,
  borough, phone, distance, its CLASS (FQHC community health center vs. NYC Health + Hospitals / NYC
  Care), and a Google Maps directions link, pass these through as given.

  ELIGIBILITY / COST / IMMIGRATION SAFETY IS PER-CLASS AND GROUNDED. State the eligibility, cost, or
  immigration-safety framing ONLY from the tool's grounded "What ... means for you" text, and carry
  its {cite:Sn} (hrsa.gov for FQHCs, access.nyc.gov for NYC Care). NEVER state a cost, a fee, an
  income cutoff, an eligibility rule, or an immigration-safety claim that isn't in the tool result —
  not from a per-site field, not from your own knowledge. If someone asks for a specific price or an
  income threshold the tool didn't return, say you don't have that figure and point them to the site
  or 646-NYC-CARE, don't invent a number.

  WHAT COVERAGE CAN I GET / IS IT SAFE. Choose one topic for the resident's requested outcome.
  For an ER or delivery bill, call get_health_coverage_guidance(topic="emergency_medicaid"). For
  separately requested ongoing low/no-cost care, call it with topic="nyc_care". Do not call both for
  one delivery-payment question. find_clinics answers WHERE to go; this answers WHAT coverage / IS IT
  SAFE. Report only what the selected topic returns, cited. Do not state a coverage rule or phone
  number from your own knowledge. Include ActionNYC public-charge routing only when the resident asks
  about public charge or immigration consequences.
  For a public-charge or "will using a benefit hurt my green card / immigration case" question, call
  get_health_coverage_guidance(topic="public_charge") and report only what it returns, cited.
  For a tourist, visitor, or anyone asking whether an ER can deny emergency care, call
  get_health_coverage_guidance(topic="emergency_care"). Keep the right to screening and stabilizing care
  separate from billing and Emergency Medicaid eligibility.

  If geocoding fails, the location is ambiguous, or no sites come back, DON'T guess a clinic: say so
  plainly and point the user to 311, 646-NYC-CARE (646-692-2273), or findahealthcenter.hrsa.gov.

  After `find_clinics` returns locations, tell the user to call ahead to confirm hours and the
  services they need; this is not medical advice and you can't diagnose; for a medical emergency,
  that's 911. Do not append this location disclaimer to coverage-only answers.
