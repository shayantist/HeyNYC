[project]
name = "heynyc"
version = "0.1.0"
description = "HeyNYC — a grounded conversational assistant for NYC services & events. Pluggable service modules, mandatory source attribution, no-hallucination eval gate."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "litellm>=1.81.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.1.1",
    "httpx>=0.27.0",
    "geopy>=2.4.0",
    "aiohttp>=3.9.0",
    "rich>=14.1.0",
    "numpy>=2.0.0",
    "lancedb>=0.13.0",
    "fastembed>=0.4.0",
    "pypdf>=6.14.2",
    "reportlab>=5.0.0",
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
whatsapp = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywa>=4.2",
    "twilio>=9.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heynyc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
