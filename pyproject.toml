[project]
name = "heynyc"
version = "0.1.0"
description = "HeyNYC — a grounded conversational assistant for NYC services & events. Pluggable service modules, mandatory source attribution, no-hallucination eval gate."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "litellm>=1.81.0",
    "pydantic>=2.11.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.1.1",
    "httpx>=0.27.0",
    "geopy>=2.4.0",
    "aiohttp>=3.9.0",
    "rich>=14.1.0",
    "numpy>=2.0.0",
    "lancedb>=0.13.0",
    "fastembed>=0.4.0",
    "pypdf>=6.15.0",
    "trafilatura>=2.0.0",
    "reportlab>=5.0.0",
    "pdfplumber>=0.11.10",
    "cryptography>=43.0.0",
    "ddgs>=9.0.0",
    "pillow>=12.3.0",
    "babel>=2.17.0",
    "markdown-it-py[linkify]>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "opentelemetry-sdk>=1.39.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15",
]
pydantic-ai = [
    "pydantic-ai-slim[anthropic,google,openai]==2.16.0",
]
whatsapp = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywa>=4.2",
    "twilio>=9.0",
    "python-multipart>=0.0.9",
]
# Tier-2 runtime-guard NLI checker (heynyc/core/nli.py::MiniCheckNLI). Self-hosted MiniCheck-Flan-T5
# via the minicheck package; heavy, so it stays an OPT-IN extra and its imports are lazy. The base
# install and the offline test suite never need it (they use MockNLI / an injected completion).
nli = [
    "torch>=2.0",
    "transformers>=4.40",
    "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@b58b9fa69acbd1015ec970fa65dd752413a053d2",
]
browser = [
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heynyc"]

# The [nli] extra pulls minicheck from git (not on PyPI), a direct reference; hatchling rejects
# those during metadata validation unless this is set, which breaks even a plain offline test run.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Lint gate: real-bug rules only. F (pyflakes) and I (import order) are enforced in CI;
# style/formatting rules stay off because the codebase predates the linter and a format
# sweep would bury real history in churn.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]
