name: CI

# Runs the offline test suite plus two security gates (dependency CVE scan + secret scan)
# on every push to main and every pull request. This is the repo's first CI; it closes
# security-audit finding F2 (no CI, no dependency/secret scanning). Action and tool versions
# are pinned (setup-uv no longer ships a moving @v8 tag, so it is patch-pinned).
on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: every job only needs to read the repo.
permissions:
  contents: read

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline test suite + dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Set up uv + Python 3.11
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true

      # Only the dev + whatsapp extras. The `nli` extra pulls torch and a git dependency
      # (minicheck), which the offline suite never needs, so it stays out of CI.
      - name: Install dependencies (dev + whatsapp extras)
        run: uv sync --frozen --extra dev --extra whatsapp

      # Real-bug rules only (pyflakes + import order), per [tool.ruff] in pyproject.toml.
      - name: Lint (ruff)
        run: uv run ruff check heynyc/ tests/ scripts/

      - name: Run the offline test suite
        run: uv run python -m pytest -q

      # Export the locked, installed dependency set so pip-audit scans exactly what we run.
      # --no-emit-project drops the unpublished heynyc package; --no-hashes keeps it a plain
      # version list for the advisory lookup.
      - name: Export locked dependencies for the audit
        run: uv export --frozen --no-emit-project --no-hashes --extra dev --extra whatsapp --output-file requirements.txt

      - name: Dependency vulnerability scan (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for a diff scan)
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      # TruffleHog OSS is free and needs no license (unlike gitleaks-action, which requires a
      # paid GITLEAKS_LICENSE to scan org-owned repos). --results=verified,unknown fails the job
      # only on credentials it could verify or could not rule out, keeping false positives down.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.95.6
        with:
          extra_args: --results=verified,unknown
