name: CI

# Runs the offline test suite plus a dependency CVE scan on every push to main and every
# pull request. GitHub provides native secret scanning and push protection for this public repo
on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: every job only needs to read the repo.
permissions:
  contents: read

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline test suite + dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Set up uv + Python 3.11
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true

      # The dev, channel, and candidate-runtime extras. The `nli` extra pulls torch and a git dependency
      # (minicheck), which the offline suite never needs, so it stays out of CI.
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra whatsapp --extra pydantic-ai

      # Real-bug rules only (pyflakes + import order), per [tool.ruff] in pyproject.toml.
      - name: Lint (ruff)
        run: uv run ruff check heynyc/ tests/ scripts/

      - name: Run the offline test suite
        run: uv run python -m pytest -q

      # Export the locked, installed dependency set so pip-audit scans exactly what we run.
      # --no-emit-project drops the unpublished heynyc package; --no-hashes keeps it a plain
      # version list for the advisory lookup.
      - name: Export locked dependencies for the audit
        run: uv export --frozen --no-emit-project --no-hashes --extra dev --extra whatsapp --extra pydantic-ai --output-file requirements.txt

      - name: Dependency vulnerability scan (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
